<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FitAgent — 从对话到有依据的执行</title>
  <desc id="desc">用户请求经过宿主与有效记忆，交给受控工具或只读领域子智能体；宿主负责验收与审批，执行记录可追踪。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d36"/><stop offset="1" stop-color="#080e1a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#67b4ff"/><stop offset="1" stop-color="#a3e5d1"/></linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <text x="56" y="72" fill="#86baff" font-size="15" letter-spacing="3">PERSONAL AGENT · FITNESS WORKSPACE</text>
    <text x="56" y="134" fill="#f4f8ff" font-size="48" font-weight="700">FitAgent</text>
    <text x="56" y="179" fill="#b9c9e1" font-size="24">从对话，到有依据、可确认、可追踪的执行。</text>
    <rect x="56" y="214" width="1088" height="2" fill="url(#accent)" opacity=".65"/>
    <g fill="#14253d" stroke="#304561">
      <rect x="56" y="253" width="242" height="151" rx="16"/>
      <rect x="338" y="253" width="242" height="151" rx="16"/>
      <rect x="620" y="253" width="242" height="151" rx="16"/>
      <rect x="902" y="253" width="242" height="151" rx="16"/>
    </g>
    <g fill="#f0f5ff" font-size="22" font-weight="600">
      <text x="78" y="293">对话式任务</text><text x="360" y="293">有效事实与记忆</text>
      <text x="642" y="293">受限执行与协作</text><text x="924" y="293">验收与执行记录</text>
    </g>
    <g fill="#b9c9e1" font-size="17">
      <text x="78" y="331">记录 · 查询 · 计划 · 复盘</text><text x="78" y="365">意图分发 / 缺失信息追问</text>
      <text x="360" y="331">任务化召回 / 多路融合</text><text x="360" y="365">纠正事实 / 派生记忆失效</text>
      <text x="642" y="331">训练 · 饮食 · 恢复子任务</text><text x="642" y="365">隔离上下文 / 只读工具</text>
      <text x="924" y="331">审批 / 状态检查 / 防重</text><text x="924" y="365">持久事件 / 历史读取</text>
    </g>
    <g fill="#86baff" font-size="26"><text x="309" y="337">→</text><text x="591" y="337">→</text><text x="873" y="337">→</text></g>
    <text x="56" y="462" fill="#a3e5d1" font-size="18">模型提出候选建议。宿主掌握权限、审批与最终写入。</text>
    <text x="1144" y="462" text-anchor="end" fill="#7f91ad" font-size="14">架构示意 · 非运行截图</text>
  </g>
</svg>
