title = "FitAgent synthetic evaluation identifiers"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic passwords used only to bootstrap isolated restart evaluations"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^algorithm/evaluation/fitagent_(http_process_restart|postgres_proxy_restart)_eval\.py$''']
regexes = ['''password\s*=\s*"synthetic-pass-[A-Za-z0-9_-]+"''']

[[allowlists]]
description = "UUID request identifiers in frozen offline replay reports are not credentials"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^algorithm/evaluation/reports/intent_(full_chat_replay|recorded_business_replay)_[^/]+/[^/]+\.json$''']
regexes = ['''"request_key"\s*:\s*"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}"''']
