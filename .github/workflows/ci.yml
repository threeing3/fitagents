name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development tools
        run: pip install -r fast_api/requirements-dev.txt

      - name: Collect changed Python files
        id: changed-python
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- '*.py' | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Ruff check
        if: steps.changed-python.outputs.files != ''
        run: ruff check ${{ steps.changed-python.outputs.files }}

      - name: Ruff format (dry-run)
        if: steps.changed-python.outputs.files != ''
        run: ruff format --check ${{ steps.changed-python.outputs.files }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r fast_api/requirements-dev.txt

      - name: Mypy strict boundary
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      DATABASE_URL: "sqlite:///:memory:"
      USE_PGVECTOR: "false"
      LLM_PROVIDER: offline
      EMBEDDING_PROVIDER: offline
      JWT_SECRET_KEY: ci-test-secret-key-for-automated-tests
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('fast_api/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r fast_api/requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --timeout=30 \
            --cov=fast_api/app --cov=algorithm --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=65

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Component tests
        working-directory: web
        run: npm test

      - name: Install Chromium for end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: web
        run: npm run test:e2e

      - name: Production build
        working-directory: web
        run: npm run build

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: ai-fitness-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-openapi:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r fast_api/requirements.txt

      - name: Export OpenAPI schema
        run: |
          python -c "
          from fast_api.app.main import app
          import json
          schema = app.openapi()
          with open('/tmp/openapi.json', 'w') as f:
              json.dump(schema, f)
          print(f'OpenAPI schema has {len(schema.get(\"paths\", {}))} paths')
          "
        env:
          DATABASE_URL: "sqlite:///:memory:"
          USE_PGVECTOR: "false"
          LLM_PROVIDER: offline
          EMBEDDING_PROVIDER: offline
          JWT_SECRET_KEY: validate-secret

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Audit Python runtime dependencies
        run: |
          pip install pip-audit==2.9.0
          pip-audit --strict --requirement fast_api/requirements.txt

      - name: Audit frontend dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high --registry=https://registry.npmjs.org

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
