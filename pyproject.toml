[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "^algorithm/research_state/",
    "^data/",
    "^logs/",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"fast_api/app/main.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = [
    "fast_api/app/core/config.py",
    "fast_api/app/db/database.py",
    "algorithm/data/schemas.py",
]
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
explicit_package_bases = true
follow_imports = "skip"
no_error_summary = true
exclude = ["^algorithm/research_state/", "^data/", "^logs/"]
